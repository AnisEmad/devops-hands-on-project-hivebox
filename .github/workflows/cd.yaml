name: CD - Continuous Delivery

on:
  push:
    branches: ["main"] # Triggers only when code hits the production main branch
    paths-ignore:
      - 'README.md'
      - '**/README.md'

# Critical: Grant the GITHUB_TOKEN write access to manage packages
permissions:
  contents: read
  packages: write

jobs:
  release-image:
    name: Build & Push Production Image to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.0.0 # Enables advanced caching and multi-platform compilation

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }} # Automatically resolves to your GitHub username
          password: ${{ secrets.GITHUB_TOKEN }} # Automatically injected one-time authentication token

      - name: Extract Docker Metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5.0.0
        with:
          images: ghcr.io/${{ github.repository }} # Formats to: ghcr.io/username/hivebox
          tags: |
            type=raw,value=latest
            type=sha,format=short # Automatically generates an image tagged with the short Git commit SHA

      - name: Build and Push Versioned Image
        uses: docker/build-push-action@v5.0.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ id.meta.outputs.tags }}
          labels: ${{ id.meta.outputs.labels }}
          cache-from: type=gha # Speeds up builds by utilizing GitHub Actions background cache caches
          cache-to: type=gha,mode=max
