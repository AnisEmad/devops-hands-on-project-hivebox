name: CD - Continuous Delivery

on:
  push:
    branches: ["main"] # Triggers only when code hits the production main branch
    paths-ignore:
      - 'README.md'
      - '**/README.md'

# Critical: Grant the GITHUB_TOKEN write access to manage packages
permissions:
  contents: read
  packages: write

jobs:
  release-image:
    name: Build & Push Production Image to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3 # Reverted to standard semantic tag

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3        # Reverted to standard semantic tag
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5     # Reverted to standard semantic tag
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and Push Versioned Image
        uses: docker/build-push-action@v5   # Reverted to standard semantic tag
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

