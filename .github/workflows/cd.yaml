name: CD - Continuous Delivery

on:
  push:
    branches: ["main"] # Triggers only when code hits the production main branch
    paths-ignore:
      - 'README.md'
      - '**/README.md'

# Critical: Grant the GITHUB_TOKEN write access to manage packages
permissions:
  contents: read
  packages: write

jobs:
  release-image:
    name: Build & Push Production Image to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db14fdd7913302d50161001d784d14660a442 # v3.0.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d # v3.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@8e17d191d092b60d453e3d62b88912888f78a845 # v5.0.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and Push Versioned Image
        uses: docker/build-push-action@4a13c500e55cf31b7a5d59a38ab2040db0f42f88 # v5.0.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

